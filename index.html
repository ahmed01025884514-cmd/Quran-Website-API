<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راديو القرآن الكريم - بث مباشر</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --gold: #d4af37;
            --emerald: #064e3b;
            --dark: #022c22;
        }

        body {
            margin: 0; padding: 0;
            background: var(--dark);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; /* لمنع التمرير غير المرغوب */
            position: relative;
        }

        /* الخلفية المتحركة (تأثير النجوم المتلألئة المتدفقة) */
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top, #065f46, var(--dark));
            z-index: -2;
        }

        .stars-layer {
            position: absolute; top: 0; left: 0; width: 200%; height: 200%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            z-index: -1;
            animation: moveStars 40s linear infinite;
            opacity: 0.4;
        }

        @keyframes moveStars {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        header { text-align: center; padding: 40px 15px 10px; z-index: 10; }
        header h1 { font-family: 'Amiri', serif; font-size: 3rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }

        /* السبحة الإلكترونية بتصميم متحرك */
        .tasbih-card {
            max-width: 250px; margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.05); border-radius: 30px;
            padding: 20px; text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(15px); z-index: 10;
        }
        .count-val { font-size: 3.5rem; font-weight: bold; color: var(--gold); display: block; }
        .btn-action {
            background: var(--gold); color: var(--dark); border: none; padding: 10px 40px;
            border-radius: 50px; font-weight: bold; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .btn-action:active { transform: scale(0.9); }

        /* مشغل البث الرئيسي */
        .player-box {
            max-width: 90%; width: 400px; margin: 0 auto;
            background: rgba(0, 0, 0, 0.6); border-radius: 40px;
            padding: 30px; border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(25px); text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.5); z-index: 10;
        }

        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .row span:first-child { color: var(--gold); font-weight: bold; font-size: 0.9rem; }

        .progress-container { margin: 25px 0; }
        .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--gold); box-shadow: 0 0 15px var(--gold); transition: 0.4s; }
        .timer-display { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 8px; opacity: 0.7; direction: ltr; }

        /* زر التشغيل النابض */
        .play-toggle {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--gold); color: var(--dark);
            border: none; font-size: 2rem; cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transition: 0.3s; display: inline-flex; align-items: center; justify-content: center;
        }
        .play-toggle.playing { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        footer { text-align: center; padding: 30px; margin-top: auto; opacity: 0.5; font-size: 0.7rem; z-index: 10; }
    </style>
</head>
<body>

<div class="stars-container"><div class="stars-layer"></div></div>

<header>
    <h1 class="animate__animated animate__fadeInDown">نورُ الهُدى</h1>
    <p class="animate__animated animate__fadeIn">بث مباشر للقرآن الكريم</p>
</header>

<div class="tasbih-card animate__animated animate__fadeInUp">
    <span id="counter" class="count-val">0</span>
    <button class="btn-action" onclick="countUp()">سبّح</button>
</div>

<main class="player-box animate__animated animate__zoomIn">
    <div class="row"><span>🎙️ القارئ:</span> <span id="readerName">-</span></div>
    <div class="row"><span>📖 السورة:</span> <span id="surahName">-</span></div>
    <div class="row"><span>⏱️ الوقت:</span> <span id="durationVal">-</span></div>
    
    <div class="progress-container">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div class="timer-display">
            <span id="totalTime">00:00:00</span>
            <span id="currTime">00:00:00</span>
        </div>
    </div>

    <button id="masterBtn" class="play-toggle"><i id="btnIcon" class="fa fa-play"></i></button>
</main>

<footer>تطوير كيمو و Gemini AI &copy; 2026</footer>

<audio id="mainAudio"></audio>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzod3HSUKOjxabBDeovU5UfVAE-bnb5DptND0MBmhIBL_sb01MOtaBStNGt9dhybHwu/exec?key=KIMO";
    const audio = document.getElementById('mainAudio');
    const masterBtn = document.getElementById('masterBtn');
    const btnIcon = document.getElementById('btnIcon');
    let streamData = null;

    // العداد
    let count = localStorage.getItem('kimo_tasbih_v2') || 0;
    document.getElementById('counter').innerText = count;
    function countUp() { count++; document.getElementById('counter').innerText = count; localStorage.setItem('kimo_tasbih_v2', count); }

    function parseTime(s) {
        if(!s) return 0;
        const p = s.split(':').map(Number);
        return p[0]*3600 + p[1]*60 + p[2];
    }

    async function syncApp() {
        try {
            const r = await fetch(API_URL + "&_=" + Date.now());
            const d = await r.json();
            streamData = d;
            document.getElementById('readerName').innerText = d.اسم_القارئ;
            document.getElementById('surahName').innerText = d.اسم_السورة;
            document.getElementById('durationVal').innerText = d.مدة_السورة;
            document.getElementById('totalTime').innerText = d.مدة_السورة;
            if (audio.src !== d.رابط_السورة) audio.src = d.رابط_السورة;
            
            if (!audio.paused) {
                const sSec = parseTime(d.الوقت_الحالي_للسورة);
                if (Math.abs(audio.currentTime - sSec) > 3) audio.currentTime = sSec;
            }
        } catch(e) {}
    }

    masterBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            btnIcon.className = "fa fa-pause";
            masterBtn.classList.add('playing');
        } else {
            audio.pause();
            btnIcon.className = "fa fa-play";
            masterBtn.classList.remove('playing');
        }
    };

    audio.ontimeupdate = () => {
        if(streamData) {
            const total = parseTime(streamData.مدة_السورة);
            const percent = (audio.currentTime / total) * 100;
            document.getElementById('progressFill').style.width = percent + "%";
            
            let s = Math.floor(audio.currentTime);
            let h = Math.floor(s/3600); let m = Math.floor((s%3600)/60); let sec = s%60;
            document.getElementById('currTime').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }
    };

    setInterval(syncApp, 15000);
    syncApp();
</script>
</body>
</html>
