<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راديو القرآن الكريم - بث مباشر</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --gold: #d4af37;
            --emerald: #064e3b;
            --dark: #022c22;
            --glass: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background: var(--dark);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            background-image: radial-gradient(circle at top, #065f46, var(--dark));
            overflow-x: hidden;
        }

        /* خلفية زخرفية متحركة */
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/islamic-art.png');
            opacity: 0.1; z-index: -1; animation: bgMove 100s linear infinite;
        }
        @keyframes bgMove { from { background-position: 0 0; } to { background-position: 1000px 1000px; } }

        header { text-align: center; padding: 30px 15px; }
        header h1 { font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }

        /* قسم السبحة */
        .tasbih-container {
            max-width: 320px; margin: 0 auto 25px;
            background: var(--glass); border-radius: 30px;
            padding: 20px; text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
        }
        .count-num { font-size: 3rem; font-weight: bold; color: var(--gold); display: block; margin-bottom: 10px; }
        .btn-tasbih {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: var(--dark); border: none; padding: 12px 40px;
            border-radius: 50px; font-weight: bold; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.2s; width: 80%;
        }
        .btn-tasbih:active { transform: scale(0.92); }

        /* مشغل البث (كيمو ستايل) */
        .player-card {
            max-width: 90%; width: 450px; margin: 0 auto 30px;
            background: rgba(0, 0, 0, 0.4); border-radius: 35px;
            padding: 30px; border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center; position: relative;
        }

        .info-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-item span:first-child { color: var(--gold); font-weight: bold; }

        /* شريط التقدم */
        .progress-area { margin: 25px 0; }
        .bar-bg { width: 100%; height: 8px; background: #111; border-radius: 10px; overflow: hidden; }
        .bar-fill { width: 0%; height: 100%; background: var(--gold); transition: 0.5s; box-shadow: 0 0 10px var(--gold); }
        .time-labels { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 8px; opacity: 0.7; }

        /* أزرار التحكم */
        .main-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--gold); color: var(--dark);
            border: none; font-size: 1.8rem; cursor: pointer;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
        }
        .main-btn:hover { transform: scale(1.05); }

        footer { text-align: center; padding: 30px; margin-top: auto; opacity: 0.6; font-size: 0.8rem; border-top: 1px solid rgba(212, 175, 55, 0.1); }
        .signature { color: var(--gold); font-weight: bold; }

        /* انيميشن للمشغل */
        .pulse-border { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }
    </style>
</head>
<body>

<div class="bg-pattern"></div>

<header>
    <h1 class="animate__animated animate__fadeInDown">نورُ الهُدى</h1>
    <p>بث مباشر للقرآن الكريم</p>
</header>

<div class="tasbih-container animate__animated animate__fadeInUp">
    <span id="counter" class="count-num">0</span>
    <button class="btn-tasbih" onclick="doTasbih()">سبّح</button>
    <div style="margin-top: 10px; font-size: 0.7rem; color: #ff7675; cursor: pointer;" onclick="resetTasbih()">تصفير</div>
</div>

<main class="player-card animate__animated animate__zoomIn">
    <div class="info-item"><span>🎙️ القارئ:</span> <span id="reader">-</span></div>
    <div class="info-item"><span>📖 السورة:</span> <span id="surah">-</span></div>
    <div class="info-item"><span>⏱️ المدة:</span> <span id="duration">-</span></div>
    
    <div class="progress-area">
        <div class="bar-bg"><div id="fill" class="bar-fill"></div></div>
        <div class="time-labels">
            <span id="current">00:00:00</span>
            <span id="total">00:00:00</span>
        </div>
    </div>

    <button id="playBtn" class="main-btn pulse-border"><i class="fa fa-play"></i></button>
</main>

<footer>
    راديو قرآن كريم - صدقة جارية <br>
    تطوير: <span class="signature">Gemini AI</span> | فكرة: <span class="signature">KIMO</span>
</footer>

<audio id="audio" preload="auto"></audio>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzod3HSUKOjxabBDeovU5UfVAE-bnb5DptND0MBmhIBL_sb01MOtaBStNGt9dhybHwu/exec?key=KIMO";
    const audio = document.getElementById('audio');
    let currentData = null;

    // العداد
    let count = localStorage.getItem('tasbih_kimo') || 0;
    document.getElementById('counter').innerText = count;
    function doTasbih() { count++; document.getElementById('counter').innerText = count; localStorage.setItem('tasbih_kimo', count); }
    function resetTasbih() { if(confirm("تصفير؟")) { count=0; document.getElementById('counter').innerText=0; localStorage.setItem('tasbih_kimo', 0); } }

    // تحويل الوقت لثواني
    function toSec(str) {
        if(!str) return 0;
        const p = str.split(':').map(Number);
        return p[0]*3600 + p[1]*60 + p[2];
    }

    // جلب البيانات ومزامنتها
    async function syncStream() {
        try {
            const r = await fetch(API + "&_=" + Date.now());
            const d = await r.json();
            currentData = d;

            document.getElementById('reader').innerText = d.اسم_القارئ;
            document.getElementById('surah').innerText = d.اسم_السورة;
            document.getElementById('duration').innerText = d.مدة_السورة;
            document.getElementById('total').innerText = d.مدة_السورة;

            if (audio.src !== d.رابط_السورة) audio.src = d.رابط_السورة;

            // مزامنة الوقت الفعلي مع السيرفر
            const serverSec = toSec(d.الوقت_الحالي_للسورة);
            if (Math.abs(audio.currentTime - serverSec) > 3) {
                audio.currentTime = serverSec;
            }
        } catch(e) { console.error("API Error"); }
    }

    // تحديث شريط التقدم
    audio.ontimeupdate = () => {
        if(currentData) {
            const total = toSec(currentData.مدة_السورة);
            const per = (audio.currentTime / total) * 100;
            document.getElementById('fill').style.width = per + "%";
            
            // تحويل الثواني الحالية لشكل 00:00:00
            let s = Math.floor(audio.currentTime);
            let h = Math.floor(s/3600);
            let m = Math.floor((s%3600)/60);
            let sec = s%60;
            document.getElementById('current').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }
    };

    document.getElementById('playBtn').onclick = () => {
        audio.play();
        document.getElementById('playBtn').innerHTML = '<i class="fa fa-volume-high"></i>';
        document.getElementById('playBtn').classList.remove('pulse-border');
    };

    // تحديث دوري كل 15 ثانية لضمان المزامنة
    setInterval(syncStream, 15000);
    syncStream();
</script>

</body>
</html>
