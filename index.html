
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راديو القرآن الكريم - بث مباشر</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --gold: #d4af37;
            --emerald: #064e3b;
            --dark: #022c22;
        }

        body {
            margin: 0; padding: 0;
            background: var(--dark);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* الخلفية المتحركة (تأثير النجوم المتلألئة) */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top, #065f46, var(--dark));
            z-index: -2;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            z-index: -1;
            animation: move-stars 50s linear infinite;
            opacity: 0.3;
        }

        @keyframes move-stars {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        header { text-align: center; padding: 40px 15px 20px; }
        header h1 { font-family: 'Amiri', serif; font-size: 3rem; color: var(--gold); margin: 0; text-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

        .tasbih-container {
            max-width: 280px; margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.05); border-radius: 30px;
            padding: 25px; text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(15px);
        }
        .count-num { font-size: 3.5rem; font-weight: bold; color: var(--gold); display: block; }
        .btn-tasbih {
            background: var(--gold); color: var(--dark); border: none; padding: 12px 45px;
            border-radius: 50px; font-weight: bold; font-size: 1.3rem;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.2s;
        }
        .btn-tasbih:active { transform: scale(0.9); }

        .player-card {
            max-width: 90%; width: 420px; margin: 0 auto;
            background: rgba(0, 0, 0, 0.5); border-radius: 40px;
            padding: 30px; border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(20px); text-align: center;
        }

        .info-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .info-item span:first-child { color: var(--gold); font-weight: bold; }

        .progress-area { margin: 30px 0; }
        .bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .bar-fill { width: 0%; height: 100%; background: var(--gold); box-shadow: 0 0 15px var(--gold); transition: 0.3s; }
        .time-labels { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 10px; opacity: 0.8; direction: ltr; }

        /* زر التحكم المطور */
        .main-btn {
            width: 85px; height: 85px; border-radius: 50%;
            background: var(--gold); color: var(--dark);
            border: none; font-size: 2rem; cursor: pointer;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            transition: 0.3s; display: inline-flex; align-items: center; justify-content: center;
        }
        .main-btn:hover { transform: scale(1.1); }

        footer { text-align: center; padding: 40px; margin-top: auto; opacity: 0.7; font-size: 0.9rem; }
        .sig { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div class="animated-bg"></div>
<div class="stars"></div>

<header>
    <h1 class="animate__animated animate__fadeInDown">نورُ الهُدى</h1>
    <p>بث مباشر للقرآن الكريم</p>
</header>

<div class="tasbih-container animate__animated animate__fadeInUp">
    <span id="counter" class="count-num">0</span>
    <button class="btn-tasbih" onclick="doTasbih()">سبّح</button>
    <div style="margin-top: 10px; font-size: 0.8rem; color: #ff7675; cursor: pointer;" onclick="resetTasbih()">تصفير</div>
</div>

<main class="player-card animate__animated animate__zoomIn">
    <div class="info-item"><span>🎙️ القارئ:</span> <span id="reader">-</span></div>
    <div class="info-item"><span>📖 السورة:</span> <span id="surah">-</span></div>
    <div class="info-item"><span>⏱️ المدة:</span> <span id="duration">-</span></div>
    
    <div class="progress-area">
        <div class="bar-bg"><div id="fill" class="bar-fill"></div></div>
        <div class="time-labels">
            <span id="totalTime">00:00:00</span>
            <span id="currentTime">00:00:00</span>
        </div>
    </div>

    <button id="playBtn" class="main-btn"><i id="playIcon" class="fa fa-play"></i></button>
</main>

<footer>تطوير كيمو و Gemini AI &copy; 2026</footer>

<audio id="audio"></audio>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzod3HSUKOjxabBDeovU5UfVAE-bnb5DptND0MBmhIBL_sb01MOtaBStNGt9dhybHwu/exec?key=KIMO";
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    let currentData = null;

    // العداد
    let count = localStorage.getItem('kimo_tasbih') || 0;
    document.getElementById('counter').innerText = count;
    function doTasbih() { count++; document.getElementById('counter').innerText = count; localStorage.setItem('kimo_tasbih', count); }
    function resetTasbih() { count=0; document.getElementById('counter').innerText=0; localStorage.setItem('kimo_tasbih', 0); }

    function toSec(str) {
        if(!str) return 0;
        const p = str.split(':').map(Number);
        return p[0]*3600 + p[1]*60 + p[2];
    }

    async function sync() {
        try {
            const r = await fetch(API + "&_=" + Date.now());
            const d = await r.json();
            currentData = d;
            document.getElementById('reader').innerText = d.اسم_القارئ;
            document.getElementById('surah').innerText = d.اسم_السورة;
            document.getElementById('duration').innerText = d.مدة_السورة;
            document.getElementById('totalTime').innerText = d.مدة_السورة;
            if (audio.src !== d.رابط_السورة) audio.src = d.رابط_السورة;
            
            // مزامنة الوقت مع السيرفر فقط إذا كان المشغل يعمل
            if (!audio.paused) {
                const sSec = toSec(d.الوقت_الحالي_للسورة);
                if (Math.abs(audio.currentTime - sSec) > 3) audio.currentTime = sSec;
            }
        } catch(e) {}
    }

    // زر التشغيل والإيقاف الموحد
    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playIcon.className = "fa fa-pause";
        } else {
            audio.pause();
            playIcon.className = "fa fa-play";
        }
    };

    audio.ontimeupdate = () => {
        if(currentData) {
            const total = toSec(currentData.مدة_السورة);
            const per = (audio.currentTime / total) * 100;
            document.getElementById('fill').style.width = per + "%";
            
            let s = Math.floor(audio.currentTime);
            let h = Math.floor(s/3600); let m = Math.floor((s%3600)/60); let sec = s%60;
            document.getElementById('currentTime').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }
    };

    setInterval(sync, 15000);
    sync();
</script>
</body>
</html>
