<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نورُ الهُدى | البث المباشر</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --gold: #d4af37;
            --emerald: #064e3b;
            --dark: #011612;
            --glass: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0; padding: 0; background: var(--dark); color: #fff;
            font-family: 'Tajawal', sans-serif; min-height: 100vh;
            overflow-x: hidden; position: relative;
        }

        /* خلفية متحركة قوية وواضحة */
        .bg-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #011612, #083d34, #011612);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; z-index: -2;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .moving-stars {
            position: fixed; top: 0; left: 0; width: 200%; height: 200%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.6; z-index: -1; animation: starFlow 30s linear infinite;
        }
        @keyframes starFlow { from { transform: translate(0,0); } to { transform: translate(-50%, -50%); } }

        header { text-align: center; padding: 30px 10px; }
        header h1 { font-family: 'Amiri', serif; font-size: 3.2rem; color: var(--gold); margin: 0; text-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }

        /* حاوية الأزرار العلوية */
        .top-tools { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .tool-btn { background: var(--glass); border: 1px solid var(--gold); color: var(--gold); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .tool-btn:hover { background: var(--gold); color: var(--dark); }

        .tasbih-box {
            max-width: 220px; margin: 0 auto 25px; background: var(--glass);
            border-radius: 25px; padding: 15px; text-align: center;
            border: 2px solid rgba(212, 175, 55, 0.4); backdrop-filter: blur(10px);
        }
        .count-txt { font-size: 3rem; font-weight: bold; color: var(--gold); display: block; }
        .btn-tasbih { background: var(--gold); color: var(--dark); border: none; padding: 8px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; }

        .main-card {
            max-width: 90%; width: 420px; margin: 0 auto; background: var(--glass);
            border-radius: 40px; padding: 25px; border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(20px); text-align: center; box-shadow: 0 15px 45px rgba(0,0,0,0.7);
        }

        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.95rem; }
        .info-row span:first-child { color: var(--gold); font-weight: bold; }

        .progress-section { margin: 25px 0; }
        .track { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; position: relative; }
        .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #b8860b, #d4af37); box-shadow: 0 0 15px var(--gold); transition: 0.4s; }
        .time-box { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 10px; opacity: 0.8; direction: ltr; }

        .controls-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 10px; }
        .play-btn { width: 85px; height: 85px; border-radius: 50%; background: var(--gold); color: var(--dark); border: none; font-size: 2.2rem; cursor: pointer; box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); transition: 0.3s; }
        .play-btn.active { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        footer { text-align: center; padding: 30px; margin-top: auto; opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="bg-wrapper"></div>
<div class="moving-stars"></div>

<header>
    <h1 class="animate__animated animate__fadeInDown">نورُ الهُدى</h1>
    <p>بث مباشر للقرآن الكريم</p>
</header>

<div class="top-tools">
    <button class="tool-btn" onclick="shareSite()" title="مشاركة"><i class="fa fa-share-alt"></i></button>
    <button class="tool-btn" id="muteBtn" onclick="toggleMute()" title="كتم"><i class="fa fa-volume-up"></i></button>
    <button class="tool-btn" onclick="location.reload()" title="تحديث"><i class="fa fa-sync"></i></button>
</div>

<div class="tasbih-box animate__animated animate__fadeInUp">
    <span id="counter" class="count-txt">0</span>
    <button class="btn-tasbih" onclick="addCount()">سبّح</button>
</div>

<main class="main-card animate__animated animate__zoomIn">
    <div class="info-row"><span>🎙️ القارئ:</span> <span id="rName">تحميل...</span></div>
    <div class="info-row"><span>📖 السورة:</span> <span id="sName">-</span></div>
    <div class="info-row"><span>⏱️ المدة:</span> <span id="dur">-</span></div>
    
    <div class="progress-section">
        <div class="track"><div id="bar" class="fill"></div></div>
        <div class="time-box"><span id="totalT">00:00:00</span> <span id="currT">00:00:00</span></div>
    </div>

    <div class="controls-row">
        <button id="pBtn" class="play-btn"><i id="pIcon" class="fa fa-play"></i></button>
    </div>
</main>

<footer>تطوير كيمو و Gemini AI &copy; 2026</footer>

<audio id="player"></audio>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzod3HSUKOjxabBDeovU5UfVAE-bnb5DptND0MBmhIBL_sb01MOtaBStNGt9dhybHwu/exec?key=KIMO";
    const audio = document.getElementById('player');
    const pBtn = document.getElementById('pBtn');
    const pIcon = document.getElementById('pIcon');
    let meta = null;

    // العداد
    let c = localStorage.getItem('t_count') || 0;
    document.getElementById('counter').innerText = c;
    function addCount() { c++; document.getElementById('counter').innerText = c; localStorage.setItem('t_count', c); }

    // كتم الصوت
    function toggleMute() {
        audio.muted = !audio.muted;
        document.getElementById('muteBtn').innerHTML = audio.muted ? '<i class="fa fa-volume-mute"></i>' : '<i class="fa fa-volume-up"></i>';
    }

    // مشاركة الموقع
    function shareSite() {
        if (navigator.share) {
            navigator.share({ title: 'راديو نور الهدى', url: window.location.href });
        } else { alert("انسخ الرابط وشاركه مع أحبابك"); }
    }

    function toS(str) {
        if(!str) return 0;
        const p = str.split(':').map(Number);
        return p[0]*3600 + p[1]*60 + p[2];
    }

    async function update() {
        try {
            const r = await fetch(API + "&_=" + Date.now());
            const d = await r.json();
            meta = d;
            document.getElementById('rName').innerText = d.اسم_القارئ;
            document.getElementById('sName').innerText = d.اسم_السورة;
            document.getElementById('dur').innerText = d.مدة_السورة;
            document.getElementById('totalT').innerText = d.مدة_السورة;
            if (audio.src !== d.رابط_السورة) audio.src = d.رابط_السورة;
            
            if (!audio.paused) {
                const s = toS(d.الوقت_الحالي_للسورة);
                if (Math.abs(audio.currentTime - s) > 3) audio.currentTime = s;
            }
        } catch(e) {}
    }

    pBtn.onclick = () => {
        if (audio.paused) {
            audio.play(); pIcon.className = "fa fa-pause"; pBtn.classList.add('active');
        } else {
            audio.pause(); pIcon.className = "fa fa-play"; pBtn.classList.remove('active');
        }
    };

    audio.ontimeupdate = () => {
        if(meta) {
            const total = toS(meta.مدة_السورة);
            const per = (audio.currentTime / total) * 100;
            document.getElementById('bar').style.width = per + "%";
            let s = Math.floor(audio.currentTime);
            let h = Math.floor(s/3600); let m = Math.floor((s%3600)/60); let sec = s%60;
            document.getElementById('currT').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }
    };

    setInterval(update, 15000);
    update();
</script>
</body>
</html>
